<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Update Cleaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B212B;
    --bg-deep: #12161D;
    --paper-notes: #FBF6E7;
    --paper-notes-line: #DED2A6;
    --paper-report: #FAFAF8;
    --ink: #21262F;
    --ink-soft: #6A7280;
    --ink-faint: #9AA1AC;
    --accent: #C4922F;
    --accent-dark: #9C7222;
    --on-dark: #EDEAE1;
    --on-dark-soft: #9099A6;
    --rag-green: #3E8F63;
    --rag-amber: #D69A34;
    --rag-red: #C1503F;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, #232B38 0%, transparent 55%),
      var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--on-dark);
    padding: 48px 24px 80px;
  }

  .shell {
    max-width: 1040px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  .subtitle {
    color: var(--on-dark-soft);
    font-size: 15px;
    line-height: 1.6;
    max-width: 520px;
    margin: 0;
  }

  .workspace {
    display: grid;
    grid-template-columns: 1fr 120px 1fr;
    align-items: stretch;
    gap: 0;
  }

  @media (max-width: 860px) {
    .workspace {
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .stamp-col { order: 2; }
    .notes-col { order: 1; }
    .report-col { order: 3; }
  }

  .card {
    background: var(--paper-notes);
    border-radius: var(--radius);
    padding: 26px 26px 22px;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
  }

  .notes-col .card {
    transform: rotate(-1.1deg);
    transition: transform 0.25s ease;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 30px,
      var(--paper-notes-line) 31px
    );
  }
  .notes-col .card:focus-within {
    transform: rotate(0deg);
  }

  .card-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  textarea {
    width: 100%;
    min-height: 320px;
    border: none;
    background: transparent;
    resize: vertical;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    line-height: 30px;
    color: var(--ink);
    outline: none;
  }
  textarea::placeholder { color: var(--ink-faint); }

  .example-btn {
    background: none;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
    margin-top: 6px;
  }
  .example-btn:hover { color: var(--ink); }

  .stamp-col {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  .stamp-btn {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--bg);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.35;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
  }
  .stamp-btn:hover {
    background: var(--accent);
    color: var(--bg-deep);
  }
  .stamp-btn:active {
    transform: scale(0.94);
  }
  .stamp-btn:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }
  .stamp-btn:focus-visible {
    outline: 2px solid var(--on-dark);
    outline-offset: 3px;
  }
  .stamp-btn svg { width: 18px; height: 18px; }

  @media (max-width: 860px) {
    .stamp-btn { width: 100%; height: 56px; border-radius: 999px; flex-direction: row; }
  }

  .report-col .card {
    background: var(--paper-report);
    min-height: 380px;
  }

  .report-empty {
    color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 1px dashed #D9D5CC;
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    margin-top: 8px;
  }

  .report-content {
    animation: rise 0.35s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .summary {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 24px;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 10px;
    padding-top: 16px;
    border-top: 1px solid #E7E3D9;
  }
  .section-label:first-of-type { border-top: none; padding-top: 0; }

  ul.plain {
    margin: 0 0 4px;
    padding-left: 18px;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.7;
  }

  ul.risks { list-style: none; margin: 0 0 4px; padding: 0; }
  .risk-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    padding: 5px 0;
  }
  .risk-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .risk-dot.green { background: var(--rag-green); }
  .risk-dot.amber { background: var(--rag-amber); }
  .risk-dot.red { background: var(--rag-red); }

  .section-empty {
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
    margin: 0 0 4px;
  }

  .error-banner {
    margin-top: 8px;
    background: #3A2420;
    border: 1px solid #6B3A32;
    color: #F2C9BE;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: var(--radius);
  }

  @media (prefers-reduced-motion: reduce) {
    .notes-col .card, .stamp-btn, .report-content { transition: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <p class="eyebrow">Notes → Update</p>
      <h1>Status Update Cleaner</h1>
      <p class="subtitle">Paste in whatever you actually wrote after a call — half-formed, out of order, some of it off the record. Get back something you'd send to a stakeholder.</p>
    </header>

    <div class="workspace">
      <div class="notes-col">
        <div class="card">
          <p class="card-label">Notes</p>
          <textarea id="notesInput" placeholder="* spoke w client Tues, generally happy but...&#10;* main issue is onboarding...&#10;* don't quote this but roughly 60%..."></textarea>
          <button class="example-btn" id="loadExample" type="button">Load example notes</button>
        </div>
      </div>

      <div class="stamp-col">
        <button class="stamp-btn" id="generateBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          <span id="btnLabel">Generate</span>
        </button>
      </div>

      <div class="report-col">
        <div class="card">
          <p class="card-label">Update</p>
          <div id="reportArea">
            <div class="report-empty">Your update will appear here.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // This build calls our own backend at /api/generate instead of Anthropic
  // directly — the API key and system prompt now live server-side only.
  // That means this file will NOT work if you just open it in a browser or
  // preview it standalone; it needs to be deployed alongside the /api
  // function (see README.md).

  const notesInput = document.getElementById('notesInput');
  const generateBtn = document.getElementById('generateBtn');
  const btnLabel = document.getElementById('btnLabel');
  const reportArea = document.getElementById('reportArea');
  const loadExampleBtn = document.getElementById('loadExample');

  const EXAMPLE_NOTES = `* spoke w client Tues. generally happy but feels like things are moving slow
* main issue is onboarding? said first couple weeks were confusing, wasnt sure who to contact / where stuff lived
* they mentioned reporting/dashboard a few times — current one "doesn't really tell us what we need" but didnt give specifics
* adoption seems ok with core team, wider team less so. maybe 60ish%? don't quote that, just impression from call
* one person on their side is pushing for more training, another thinks training isn't the problem
* asked if we can make setup faster for new users
* also wants clearer weekly updates, currently too many emails / not enough useful info
* there was a problem last month with data syncing, fixed now apparently, but they're still nervous about it happening again
* renewal comes up later this year. no direct risk mentioned but worth watching
* they like [feature A] a lot, said it saves them time
* possible opportunity: expand to another team, but probably only if onboarding gets easier
* follow up: send examples of dashboard/reporting options
* follow up with product re: onboarding flow
* maybe schedule training? unclear if they actually want this
* overall: positive relationship, some frustration, not urgent / no major escalation
* next call in ~2 weeks`;

  loadExampleBtn.addEventListener('click', () => {
    notesInput.value = EXAMPLE_NOTES;
    notesInput.focus();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderList(items) {
    if (!items || items.length === 0) {
      return '<p class="section-empty">No update.</p>';
    }
    return '<ul class="plain">' + items.map(i => `<li>${escapeHtml(i)}</li>`).join('') + '</ul>';
  }

  function renderRisks(risks) {
    if (!risks || risks.length === 0) {
      return '<p class="section-empty">No update.</p>';
    }
    return '<ul class="risks">' + risks.map(r =>
      `<li class="risk-item"><span class="risk-dot ${escapeHtml(r.severity || 'amber')}"></span><span>${escapeHtml(r.text)}</span></li>`
    ).join('') + '</ul>';
  }

  function renderReport(data) {
    reportArea.innerHTML = `
      <div class="report-content">
        <p class="summary">${escapeHtml(data.summary || 'No update.')}</p>
        <p class="section-label">Progress</p>
        ${renderList(data.progress)}
        <p class="section-label">Risks &amp; Blockers</p>
        ${renderRisks(data.risks)}
        <p class="section-label">Next Steps</p>
        ${renderList(data.next_steps)}
      </div>
    `;
  }

  function renderError(message) {
    reportArea.innerHTML = `<div class="error-banner">Couldn't generate an update — ${escapeHtml(message)}</div>`;
  }

  generateBtn.addEventListener('click', async () => {
    const notes = notesInput.value.trim();
    if (!notes) {
      renderError('paste some notes first.');
      return;
    }

    generateBtn.disabled = true;
    btnLabel.textContent = '...';
    reportArea.innerHTML = '<div class="report-empty">Drafting...</div>';

    try {
      const response = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ notes })
      });

      const data = await response.json();

      if (!response.ok) {
        renderError(data.error || 'try again in a moment.');
        return;
      }

      renderReport(data);

    } catch (err) {
      renderError('couldn\u2019t reach the server — try again in a moment.');
      console.error(err);
    } finally {
      generateBtn.disabled = false;
      btnLabel.textContent = 'Generate';
    }
  });
</script>
</body>
</html>
